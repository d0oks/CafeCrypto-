<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>

<title>404 — Page introuvable | Café Crypto</title>

<meta name="robots" content="noindex, nofollow"/>

<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0d14;--s1:#111827;--gold:#f0b429;--cyan:#38bdf8;--red:#ef4444;--text:#c9d3e3;--muted:#8aa3be}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(180deg,#0a0d14 0%,#0d1119 100%);color:var(--text);
  font-family:'Inter',system-ui,sans-serif;text-align:center}
.card{max-width:480px;width:100%;background:var(--s1);border:1px solid rgba(220,38,38,.25);
  border-radius:16px;padding:40px 28px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.logo{font-family:'MedievalSharp',serif;font-size:1.8rem;
  background:linear-gradient(90deg,var(--gold),var(--cyan));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;margin-bottom:24px}
.code{font-family:'JetBrains Mono',monospace;font-size:4.5rem;font-weight:500;color:var(--red);
  line-height:1;text-shadow:0 0 24px rgba(239,68,68,.4)}
.chart{display:block;margin:16px auto;width:200px;height:60px}
h1{font-size:1.2rem;margin-bottom:8px;color:#fff}
p{color:var(--muted);font-size:.95rem;line-height:1.5;margin-bottom:24px}
.btn{display:inline-block;padding:12px 28px;border-radius:10px;font-weight:600;font-size:.95rem;
  text-decoration:none;color:#0a0d14;background:linear-gradient(90deg,var(--gold),var(--cyan));
  transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-2px);opacity:.92}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">Café Crypto</div>
  <div class="code">404</div>
  <svg class="chart" viewBox="0 0 200 60" aria-hidden="true">
    <polyline points="0,15 30,22 55,12 85,30 110,25 140,45 170,50 200,58" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Page introuvable</h1>
  <p>Cette page a chuté plus vite qu'un altcoin un lundi matin. Elle n'existe pas ou a été déplacée.</p>
  <a class="btn" href="/CafeCrypto-/">Retour aux marchés</a>
</main>
</body>
</html>
